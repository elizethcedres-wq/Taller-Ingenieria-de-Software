services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: turnosdb
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  app-listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_listener
    depends_on:
      mosquitto:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      BROKER_URL: tcp://mosquitto:1883
      MAIN_CLASS: com.mycompany.taller2.ingsoft.SubscriberReservaMQTT
      TZ: America/Montevideo
    restart: on-failure

  app-generador:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_generador
    depends_on:
      mosquitto:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      BROKER_URL: tcp://mosquitto:1883
      MAIN_CLASS: com.mycompany.taller2.ingsoft.GeneradorReservasMQTT
      TZ: America/Montevideo
    restart: on-failure

  procesador-solicitudes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procesador_solicitudes
    depends_on:
      mysql-db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      MAIN_CLASS: com.mycompany.taller2.ingsoft.ProcesadorSolicitudes
      VALIDATION_INTERVAL_SECONDS: "60"
      BROKER_URL: tcp://mosquitto:1883
      TZ: America/Montevideo
    restart: on-failure

  facturador:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturador
    depends_on:
      mysql-db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      MAIN_CLASS: com.mycompany.taller2.ingsoft.FacturadorAutomatico
      BILLING_INTERVAL_SECONDS: "300"
      BROKER_URL: tcp://mosquitto:1883
      TZ: America/Montevideo
    restart: on-failure

  api-rest:
    build:
      context: ./api-rest
      dockerfile: Dockerfile
    container_name: api_rest
    depends_on:
      mysql-db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DB_URL: "jdbc:mysql://mysql-db:3306/turnosdb?useSSL=false&allowPublicKeyRetrieval=true&preserveInstants=false"
      DB_USER: root
      DB_PASSWORD: root
      BROKER_URL: tcp://mosquitto:1883
      TZ: America/Montevideo
    ports:
      - "8080:8080"
    restart: on-failure


volumes:
  mysql_data:
